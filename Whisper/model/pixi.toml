[workspace]
name = "whisper-model"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.11.*"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]

[pypi-dependencies]
# Same TF pin as the Axon compiler container (converter parity).
tensorflow = "==2.19.0"
# Reference implementation + checkpoint loader + tokenizer.
openai-whisper = "==20240930"
soundfile = ">=0.12"

[tasks]
reference = "python whisper_ref.py"
export = "python export.py"
simulate = "python simulate.py"
