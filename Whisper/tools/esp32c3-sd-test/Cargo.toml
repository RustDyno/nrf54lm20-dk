[package]
name = "esp32c3-sd-test"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32c3"] }
esp-hal = { version = "1.1", features = ["esp32c3", "unstable"] }
esp-println = { version = "0.17", features = ["esp32c3"] }

[profile.release]
opt-level = "s"
lto = true
