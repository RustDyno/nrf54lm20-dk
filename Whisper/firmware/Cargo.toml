[package]
name = "whisper-firmware"
version = "0.1.0"
edition = "2021"
description = "Layer-streaming Whisper executor on the nRF54LM20-DK: NPU submodel blobs in a RAM slot + CPU glue kernels, driven by a host-side tape orchestrator"

# Standalone workspace: not part of any parent crate's build.
[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
# "device": we provide the device interrupt vector table ourselves (__INTERRUPTS
# in main.rs) so the AXONS IRQ (86) has a real handler; without it cortex-m-rt
# emits only 32 default vectors and IRQ 86 vectors into garbage.
cortex-m-rt = { version = "0.7", features = ["device"] }
rtt-target = "0.6"
libm = "0.2"
# System bring-up (init) and the register-level PAC (re-exported as embassy_nrf::pac) for the
# nRF54LM20 application core, secure aliases. No executor: the firmware
# stays a polled step machine on the PAC registers (the HAL drivers do not
# fit its drivers; see the module docs).
embassy-nrf = { version = "0.11", default-features = false, features = ["nrf54lm20-app-s", "unstable-pac"] }
# Half-dB fixed point for the PDM gain, the type embassy-nrf's PDM API uses.
fixed = "1.10"

# embassy-nrf 0.11.0 with one fix on top, kept in-tree until it is upstream:
# GPIO port 3 and the PDM20/PDM21 singletons (patches/embassy-nrf-0.11.0-nrf54lm20.patch). The HAL's port
# lookup covered ports 0-2 only, so any P3 pin handed to a HAL driver was
# undefined behavior on this chip.
[patch.crates-io]
embassy-nrf = { path = "vendor/embassy-nrf" }

[build-dependencies]
cc = "1"
bindgen = "0.70"

# Optimize even in dev so the CPU kernels and the C driver behave like the
# real target: the mock-usb rig builds this profile, and its timings must
# be the stick's. Overflow checks and debug assertions would otherwise
# put a panic check in every hot loop the release build does not have.
[profile.dev]
opt-level = 3
overflow-checks = false
debug-assertions = false

[profile.release]
opt-level = 3
lto = true

[features]
# Probe the SD card (SPIM00 wiring) when no USB stick answers: the
# storage path from before the stick. Off by default -- the standalone
# build tries the stick three times and then stays in mailbox mode.
sd-card = []
# Diagnostic fallback: SD on SPIM22 at 8 MHz via plain P3 pins (original
# wiring, no analog switches). Disables the OLED (shared serial box/pins).
sd-spim22 = ["sd-card"]
# Skip mic/mel/encoder/cross and decode against the scratch already on
# the card (from the last complete run). Development iteration aid.
decode-only = []
# Development rig: serve the model image from a PC over USB device mode
# instead of reading a stick (tools/mockusb). Mutually exclusive with the
# USB host backend -- same peripheral, opposite role.
mock-usb = []
# Record microphone windows and report their level, stopping at the first
# one loud enough to be speech and leaving it in S_PCM for the host to
# pull. Needs the mock rig for the PCM spill and the work image.
mic-check = ["mock-usb"]
# Log every NPU run (validate and infer result codes): two RTT lines per
# blob, thousands per utterance. Off by default; the per-phase summary
# lines and any non-zero result are printed regardless.
npu-log = []
